name: SameGoat
options:
  bundleIdPrefix: com.samegoat
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

configs:
  Debug: debug
  Local: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_MODULE_NAME: SameGoat
    # Collect user-facing strings into the String Catalog (Shared/Localizable.xcstrings).
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # The Apple developer team that signs the app. Local builds turn signing off, so they ignore it.
    DEVELOPMENT_TEAM: 8K5724Q6WR
    # Let Xcode create and refresh profiles for every app target. Without this the Mac targets
    # are signed manually and fail with "requires a provisioning profile". The Local config
    # and the test target switch signing off or to manual below.
    CODE_SIGN_STYLE: Automatic
  configs:
    Local:
      # "Local" builds skip CloudKit entirely so the app runs without a paid
      # developer account or an iCloud sign-in. Data stays on the device.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG LOCAL_ONLY"
    Release:
      ONLY_ACTIVE_ARCH: NO

targets:
  SameGoat-iOS:
    type: application
    platform: iOS
    sources: [Shared]
    dependencies:
      - target: SameGoatWidget
    settings:
      base:
        PRODUCT_NAME: SameGoat
        PRODUCT_BUNDLE_IDENTIFIER: com.samegoat.SameGoat
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/iOS-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Local:
          CODE_SIGN_ENTITLEMENTS: ""
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleDisplayName: Same Goat
        CFBundleLocalizations: [en, es]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [remote-notification]
        CKSharingSupported: true
        CloudKitContainerID: iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Config/iOS.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.com.samegoat.SameGoat]

  # Home-screen and Lock Screen widget. It reads a snapshot the app writes to the
  # shared app group container, since it can't open the Core Data store itself.
  SameGoatWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared/WidgetData
      - Shared/Localizable.xcstrings
    settings:
      base:
        PRODUCT_NAME: SameGoatWidget
        PRODUCT_MODULE_NAME: SameGoatWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.samegoat.SameGoat.Widget
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Widget-Info.plist
        # Colors the widget gallery's Add Widget button; the widget itself uses Color.happy.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
      configs:
        Local:
          CODE_SIGN_ENTITLEMENTS: ""
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Same Goat
        CFBundleLocalizations: [en, es]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.samegoat.SameGoat]

  SameGoat-macOS:
    type: application
    platform: macOS
    sources: [Shared]
    dependencies:
      - target: SameGoatWidget-macOS
    settings:
      base:
        PRODUCT_NAME: SameGoat
        PRODUCT_BUNDLE_IDENTIFIER: com.samegoat.SameGoat
        # Universal binary: Apple silicon + Intel.
        ARCHS: "$(ARCHS_STANDARD)"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/macOS-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Local:
          CODE_SIGN_ENTITLEMENTS: ""
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
    info:
      path: Config/macOS-Info.plist
      properties:
        CFBundleDisplayName: Same Goat
        CFBundleLocalizations: [en, es]
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.lifestyle
        # Mac app groups carry the team prefix; WidgetSnapshot reads the name from here.
        SameGoatAppGroup: $(TeamIdentifierPrefix)group.com.samegoat.SameGoat
        CKSharingSupported: true
        CloudKitContainerID: iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Config/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)group.com.samegoat.SameGoat]

  SameGoatWidget-macOS:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared/WidgetData
      - Shared/Localizable.xcstrings
    settings:
      base:
        PRODUCT_NAME: SameGoatWidget
        PRODUCT_MODULE_NAME: SameGoatWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.samegoat.SameGoat.Widget
        ARCHS: "$(ARCHS_STANDARD)"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Widget-macOS-Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
      configs:
        Local:
          CODE_SIGN_ENTITLEMENTS: ""
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
    info:
      path: Config/Widget-macOS-Info.plist
      properties:
        CFBundleDisplayName: Same Goat
        CFBundleLocalizations: [en, es]
        SameGoatAppGroup: $(TeamIdentifierPrefix)group.com.samegoat.SameGoat
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)group.com.samegoat.SameGoat]

  SameGoatTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: SameGoat-macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.samegoat.SameGoatTests
        PRODUCT_MODULE_NAME: SameGoatTests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SameGoat.app/Contents/MacOS/SameGoat"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SameGoat-iOS:
    build:
      targets:
        SameGoat-iOS: all
    run:
      config: Debug
  SameGoat-iOS-Local:
    build:
      targets:
        SameGoat-iOS: all
    run:
      config: Local
  SameGoat-macOS:
    build:
      targets:
        SameGoat-macOS: all
    run:
      config: Debug
  SameGoat-macOS-Local:
    build:
      targets:
        SameGoat-macOS: all
    run:
      config: Local
    test:
      config: Local
      targets: [SameGoatTests]
